<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실행 로그 - Crypto Quant Wizard</title>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <svg class="brand-svg-logo" viewBox="0 0 36 36" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Crypto Quant Wizard 로고">
        <rect width="36" height="36" rx="9" fill="url(#brand-logo-grad)"/>
        <defs>
          <linearGradient id="brand-logo-grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0d9488"/>
            <stop offset="1" stop-color="#059669"/>
          </linearGradient>
        </defs>
        <path d="M8 24L14 17L19 21L28 11" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28" cy="11" r="2.5" fill="#ffffff"/>
        <path d="M13 7L14.2 10.2L17.5 11.5L14.2 12.8L13 16L11.8 12.8L8.5 11.5L11.8 10.2Z" fill="#fbbf24"/>
      </svg>
      <div>
        <div class="brand-title">Crypto Quant Wizard</div>
        <div class="brand-subtitle">오픈소스 3대 거래소 암호화폐 퀀트 매니저</div>
      </div>
    </div>

    <!-- Navigation Tabs (Multi-Page Coherence) -->
    <nav class="nav-tabs" role="tablist" aria-label="메인 네비게이션">
      <a href="index.html" class="tab-btn" id="tab-btn-dashboard">
        <i data-lucide="layout-dashboard"></i>
        <span>대시보드</span>
      </a>
      <a href="wizard.html" class="tab-btn" id="tab-btn-wizard">
        <i data-lucide="sliders"></i>
        <span>설정 마법사</span>
      </a>
      <a href="logs.html" class="tab-btn active" id="tab-btn-logs">
        <i data-lucide="terminal"></i>
        <span>실행 로그</span>
      </a>
      <a href="guide.html" class="tab-btn" id="tab-btn-guide">
        <i data-lucide="book-open"></i>
        <span>도움말</span>
      </a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="btn-run" id="btn-run-now" onclick="triggerRunNow()" data-tooltip="매일 아침 09:05 스케줄을 기다리지 않고, 현재 시장 데이터로 지금 즉시 분석 및 매매를 1회 수동 실행합니다." data-tooltip-pos="bottom-left">
        <i data-lucide="zap"></i>
        <span>지금 1회 수동 실행</span>
      </button>
      <button class="icon-btn" onclick="togglePrivacy()" data-tooltip="자산 가치 마스킹 / 표시 전환" data-tooltip-pos="bottom-left" aria-label="자산 가치 마스킹 전환">
        <i data-lucide="eye" id="privacy-icon"></i>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" data-tooltip="다크 모드 / 라이트 모드 전환" data-tooltip-pos="bottom-left" aria-label="테마 전환">
        <i data-lucide="sun-moon" id="theme-icon"></i>
      </button>
    </div>
  </header>

  <main>
    <div class="dashboard-container">

      <div class="wizard-header">
        <h1 class="wizard-title">
          <i data-lucide="terminal"></i>
          <span>실시간 콘솔 실행 로그</span>
        </h1>
        <p class="wizard-desc">
          백엔드 APScheduler 및 거래소 API 체결 내역이 실시간으로 스트리밍됩니다.
        </p>
      </div>

      <div class="card">
        <div class="card-title">
          <span>엔진 동작 로그 콘솔</span>
          <div class="logs-control-group">
            <label class="logs-refresh-label" for="auto-refresh-logs">
              <input type="checkbox" id="auto-refresh-logs" checked> 3초마다 자동 갱신
            </label>
            <button class="btn-test" onclick="fetchLogs()">지금 새로고침</button>
            <button class="btn-test" onclick="clearLogs()">콘솔 비우기</button>
          </div>
        </div>
        <div class="terminal" id="terminal-view">
로그를 불러오는 중입니다...
        </div>
      </div>

    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script>
    let logPollTimer = null;

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('quant_theme', next);
      if (window.lucide) lucide.createIcons();
    }

    function togglePrivacy() {
      // Logs do not have private financial targets
      showToast('실행 로그 페이지입니다.');
    }

    function showToast(msg, duration = 3000) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, duration);
    }

    async function triggerRunNow() {
      const btn = document.getElementById('btn-run-now');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2"></i> <span>실행 중...</span>';
      if (window.lucide) lucide.createIcons();
      showToast('지금 즉시 분석 및 매매를 1회 실행합니다...');

      try {
        const res = await fetch('/api/run-bot', { method: 'POST' });
        const data = await res.json();
        showToast(data.message || '매매 사이클 실행이 완료되었습니다!');
        fetchLogs();
      } catch (e) {
        showToast('실행 요청 중 오류가 발생했습니다: ' + e);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="zap"></i> <span>지금 1회 수동 실행</span>';
        if (window.lucide) lucide.createIcons();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function fetchLogs() {
      try {
        const res = await fetch('/api/logs?limit=150');
        const data = await res.json();
        const term = document.getElementById('terminal-view');
        if (data.logs && data.logs.length > 0) {
          term.innerHTML = data.logs.map(l => {
            return `<div class="log-line"><span class="log-timestamp">${l.timestamp}</span> <span class="log-${l.level}">[${l.level}]</span> ${escapeHtml(l.message)}</div>`;
          }).join('');
          term.scrollTop = term.scrollHeight;
        } else {
          term.innerText = '기록된 실행 로그가 아직 없습니다.';
        }
      } catch (e) {
        console.error('Failed to fetch logs:', e);
      }
    }

    function clearLogs() {
      document.getElementById('terminal-view').innerHTML = '<div class="log-line" style="color:var(--text-muted)">콘솔 화면을 비웠습니다. 다음 갱신 시 최신 로그를 다시 로드합니다.</div>';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('quant_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      if (window.lucide) lucide.createIcons();
      fetchLogs();

      logPollTimer = setInterval(() => {
        const chk = document.getElementById('auto-refresh-logs');
        if (chk && chk.checked) {
          fetchLogs();
        }
      }, 3000);
    });
  </script>

</body>
</html>
