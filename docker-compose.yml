services:
  crypto-quant-wizard:
    build: .
    container_name: crypto-quant-wizard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
